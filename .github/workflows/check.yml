# atomic-spec://ARCH-RELEASE-001/DR-2
# Удалённая проверка выполняет реальные сценарии установки и браузерную приёмку до сборки артефактов.
name: Release checks
on:
  push:
    branches: [main, release/v2.0.2]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.22.x'
          cache: false
      - run: python -m pip install -r requirements-dev.txt
      - name: Select the hosted runner Chrome
        run: |
          atomic_browser=$(command -v google-chrome)
          test -x "$atomic_browser"
          printf 'ATOMIC_SPEC_BROWSER=%s\n' "$atomic_browser" >> "$GITHUB_ENV"
      - name: Prepare parser dependencies explicitly
        run: ATOMIC_SPEC_CACHE_DIR="$PWD/.local/guard-cache" bash skills/atomic-spec-orchestrator/scripts/setup-guard.sh
      - name: Guard behavioral regressions
        run: SPECGUARD_PYTHON=python SPECGUARD_NODE_MODULES="$PWD/.local/guard-cache/node/node_modules" bash skills/atomic-spec-orchestrator/vendor/specguard/scripts/check.sh
      - run: python tools/release.py check
      - run: python tools/release.py build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-evidence
          path: |
            .local/acceptance/
            .local/release/
          include-hidden-files: true

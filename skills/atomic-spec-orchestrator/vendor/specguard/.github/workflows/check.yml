# atomic-spec://SKSTORE-ATOMIC-GUARD-001/DR-16
# Удалённый допуск требует тех же реальных парсеров, регрессий и собственной проверки, что и локальная разработка.
name: check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.22.x'
          cache: false
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --ignore-scripts
      - run: bash scripts/check.sh
      - run: bash scripts/self-check.sh
